[project]
name = "dba-agent"
dynamic = ["version"]  # VERSION in tools/config.py; this project is not built as a package
description = "Claude Code plugin and stdlib-only Python tools for Oracle DBA work"
requires-python = ">=3.10"
dependencies = []  # user-facing tools are stdlib only

[dependency-groups]
dev = ["pytest", "ruff", "pyyaml", "tomli; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Oracle 23ai Free test container reached through `sql -mcp`",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["spike"]  # frozen spike evidence, not product code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
extra-standard-library = ["tomllib"]  # stdlib from 3.11; the tests use it
