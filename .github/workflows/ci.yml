name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip && python -m pip install --group dev
      - run: ruff check .
      - run: python -m tools lint

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip && python -m pip install --group dev
      - run: python -m pytest tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
        sqlcl: ["25.3.2", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: python -m pip install -U pip && python -m pip install --group dev
      - name: Generate database password
        run: |
          password="P$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          echo "ORACLE_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: .github/scripts/install-sqlcl.sh ${{ matrix.sqlcl }}
      - run: docker compose -f tests/docker-compose.yml up -d --wait
      - run: python -m pytest -m integration
        env:
          REQUIRE_INTEGRATION: "1"
